<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>多AI问答助手</title>
  <link rel="icon" type="image/png" href="../assets/launcher-pet.png">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="../shared/affiliate-catalog.css">
</head>
<body>
  <header class="topbar">
    <div class="brand" title="多AI问答助手"><img class="brand-mark" src="../assets/launcher-pet.png" alt=""><strong>多AI问答</strong></div>
    <div class="toolbar-right">
      <button id="newChat" class="toolbar-button" title="新对话" aria-label="新对话"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14a4 4 0 0 1-4 4H9l-5 3v-5.5A7 7 0 0 1 3 12V8a4 4 0 0 1 4-4h6"/><path d="M18 3v6M15 6h6"/></svg></button>
      <button id="historyToggle" class="toolbar-button" title="历史记录" aria-label="历史记录"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7v5h5"/><path d="M5.5 17.5A8 8 0 1 0 4 12"/><path d="M12 8v5l3 2"/></svg></button>
      <label class="layout-control" title="调整页面布局"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="8" height="7" rx="1.5"/><rect x="13" y="4" width="8" height="7" rx="1.5"/><rect x="3" y="13" width="8" height="7" rx="1.5"/><rect x="13" y="13" width="8" height="7" rx="1.5"/></svg>
        <select id="layout">
          <option value="auto">自动布局</option>
          <optgroup label="单行">
            <option value="1x1">单行 1 列</option><option value="1x2">单行 2 列</option><option value="1x3">单行 3 列</option><option value="1x4">单行 4 列</option><option value="1x5">单行 5 列</option>
          </optgroup>
          <optgroup label="双行">
            <option value="2x2">双行 2×2</option><option value="2x3">双行 2×3</option><option value="2x4">双行 2×4</option><option value="2x5">双行 2×5</option>
          </optgroup>
        </select>
      </label>
      <button id="addService" class="toolbar-button platform-manager-button" title="管理平台（添加、移除和排序）" aria-label="管理平台"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="8" height="7" rx="2"/><rect x="3" y="13" width="8" height="7" rx="2"/><path d="M16 5v6M13 8h6M13.5 17h5"/></svg></button>
      <div class="frame-pager" aria-label="面板翻页"><button id="framesPrev" title="上一屏 AI 面板" aria-label="上一屏 AI 面板"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg></button><button id="framesNext" title="下一屏 AI 面板" aria-label="下一屏 AI 面板"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></button></div>
      <span class="toolbar-divider" aria-hidden="true"></span>
      <button id="sidePanelToggle" class="toolbar-button" title="切换到侧栏模式" aria-label="切换到侧栏模式"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16M17.8 8h.1M17.8 12h.1"/></svg></button>
      <button id="minimizeToggle" class="toolbar-button" title="最小化为网页桌宠" aria-label="最小化为网页桌宠"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="m8 8-4 4 4 4M16 8l4 4-4 4"/></svg></button>
      <button id="themeToggle" class="toolbar-button" title="切换明暗主题" aria-label="切换明暗主题"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 15.5A8 8 0 0 1 8.5 3.8 8.5 8.5 0 1 0 20.5 15.5Z"/></svg></button>
      <button id="affiliateToggle" class="toolbar-button affiliate-toolbar-button" title="AI 工具精选 · 推广" aria-label="AI 工具精选 · 推广"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="9" width="16" height="11" rx="2"/><path d="M12 9v11M4 13h16M7 9c-2.4 0-3.5-3.2-1.4-4.4C8 3.2 12 9 12 9s4-5.8 6.4-4.4C20.5 5.8 19.4 9 17 9"/></svg><span data-affiliate-label>AI 工具精选</span><small data-affiliate-badge>推广</small></button>
      <button id="aboutToggle" class="toolbar-button" title="关于与联系" aria-label="关于与联系"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s-8-4.6-8-10.3A4.7 4.7 0 0 1 12 7a4.7 4.7 0 0 1 8 3.2c0 5.7-8 10.3-8 10.3Z"/><path d="M12 11v5M12 8.5h.01"/></svg></button>
      <button id="settingsToggle" class="toolbar-button settings-button" title="配置" aria-label="配置"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1v.1h-4v-.1a1.7 1.7 0 0 0-1.1-1.6 1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1-.4h-.1v-4H3a1.7 1.7 0 0 0 1.6-1.1 1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1v-.1h4V3a1.7 1.7 0 0 0 1.1 1.6 1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.4 9c.15.37.36.7.6 1 .27.28.63.42 1 .4h.1v4H21a1.7 1.7 0 0 0-1.6.6Z"/></svg></button>
    </div>
  </header>

  <main class="workspace-shell">
    <section id="frames" class="frames" aria-label="平台面板"></section>
  </main>

  <section id="composer" class="composer" aria-label="悬浮提问区">
    <div id="composerDragHandle" class="composer-drag-handle" title="拖动提问框"><span>提问</span><span class="drag-hint">⋮⋮ 拖动</span></div>
    <textarea id="question" rows="2" maxlength="20000" placeholder="输入一个问题，同时询问多个 AI…"></textarea>
    <div class="composer-actions">
      <label id="attachLabel" class="file-button">添加附件<input id="attachments" type="file" multiple accept="image/*,.pdf,.doc,.docx,.txt,.md,.xls,.xlsx,.csv"></label>
      <span id="fileSummary" class="file-summary"></span>
      <label class="mode-control">模式<select id="answerMode"><option value="expert">专家</option><option value="fast">快速</option></select></label>
      <button id="send" class="primary">同时提问</button>
    </div>
    <div id="status" role="status" aria-live="polite"></div>
  </section>

  <div id="drawerBackdrop" class="drawer-backdrop" hidden></div>

  <aside id="servicePanel" class="drawer manager-drawer" hidden aria-label="管理平台">
    <div class="drawer-head"><div><strong>管理平台</strong><small id="serviceCount">已添加 0/10</small></div><button id="serviceClose" class="icon-button" aria-label="关闭">×</button></div>
    <input id="serviceSearch" class="drawer-search" type="search" placeholder="搜索平台…">
    <div id="serviceCategories" class="category-tabs"><button data-category="ai" class="active">AI 平台</button><button data-category="search">搜索</button><button data-category="content">内容</button></div>
    <section class="manager-section"><h3>已添加平台 <small>拖动调整顺序</small></h3><div id="selectedServices" class="selected-services"></div></section>
    <section class="manager-section service-catalog-section"><h3>可添加平台</h3><div id="serviceCatalog" class="service-catalog"></div></section>
    <div class="drawer-footer"><button id="serviceCancel">取消</button><button id="serviceApply" class="primary">应用更改</button></div>
  </aside>

  <aside id="settingsPanel" class="drawer settings-drawer" hidden aria-label="配置">
    <div class="drawer-head"><strong>配置</strong><button id="settingsClose" class="icon-button" aria-label="关闭">×</button></div>
    <nav id="settingsTabs" class="settings-tabs"><button data-settings-tab="general" class="active">常规</button><button data-settings-tab="operations">右键与快捷操作</button></nav>
    <div id="settingsGeneral">
    <section class="settings-section">
      <label>新打开插件时<select id="openBehavior"><option value="new">创建新对话</option><option value="resume">使用上次对话</option></select></label>
      <label>默认回答模式<select id="settingsAnswerMode"><option value="expert">专家</option><option value="fast">快速</option></select></label>
      <label>界面语言<select id="locale"><option value="zh">中文</option><option value="en">English</option></select></label>
    </section>
    <section class="settings-section">
      <label class="setting-row"><div><strong>网页桌宠显示范围</strong><small>所有普通网页需要一次可选授权</small></div><select id="launcherScope"><option value="all">所有普通网页（推荐）</option><option value="supported">仅支持的 AI/搜索平台</option><option value="off">关闭桌宠</option></select></label>
      <label class="setting-row"><div><strong>桌宠样式</strong><small>动画模式会根据点击和拖动切换动作</small></div><select id="launcherStyle"><option value="animated">动画桌宠</option><option value="image">图片桌宠</option></select></label>
      <label class="setting-row"><div><strong>动画内容</strong><small>丰富模式会随机切换点击反馈和休闲动作</small></div><select id="launcherAnimationPack"><option value="rich">丰富动作（推荐）</option><option value="basic">基础动作</option></select></label>
      <label class="setting-row"><div><strong>随机动作频率</strong><small>页面处于后台时会自动暂停</small></div><select id="launcherRandomFrequency"><option value="off">关闭</option><option value="low">低（60–120 秒）</option><option value="normal">正常（30–60 秒）</option><option value="high">高（15–30 秒）</option></select></label>
      <label class="setting-row launcher-size-row"><div><strong>桌宠大小</strong><small>动画按高度计算，图片按宽高计算</small></div><div class="range-control"><input id="launcherSize" type="range" min="96" max="240" step="8" value="160"><output id="launcherSizeValue" for="launcherSize">160 px</output></div></label>
      <button id="resetLauncherPosition">恢复桌宠默认位置</button>
      <button id="resetComposerPosition">恢复提问框默认位置</button>
    </section>
    <section class="settings-section legal-settings">
      <div class="setting-row"><div><strong>隐私与开源信息</strong><small>了解本地数据、第三方平台与扩展权限</small></div></div>
      <div class="legal-settings-actions"><button id="privacyPolicyOpen">隐私政策</button><button id="aboutOpen">关于与联系</button></div>
    </section>
    <section class="settings-section affiliate-settings">
      <div class="setting-row"><div><strong id="affiliateSettingTitle">AI 工具精选</strong><small id="affiliateSettingHint">顶部入口包含明确标注的可选推广链接</small></div><label class="switch" title="显示 AI 工具精选入口"><input id="affiliateEntryVisible" type="checkbox" checked><span></span></label></div>
    </section>
    </div>
    <section id="operationSettings" class="settings-section operation-settings" hidden>
      <div class="operation-toolbar"><label>菜单模式<select id="contextMenuMode"><option value="flat">默认平铺</option><option value="grouped">允许一层分组</option></select></label><div><button id="newOperationGroup">＋ 分组</button><button id="newPromptTemplate">＋ 操作</button></div></div>
      <p id="menuLengthHint" class="settings-hint"></p>
      <div id="operationGroupList" class="operation-group-list"></div>
      <div id="promptTemplateList" class="prompt-template-list"></div>
      <section class="shortcut-panel"><div class="setting-row"><div><strong>快捷键</strong><small>快捷槽位可绑定任意内置或自定义操作</small></div><button id="openShortcutSettings">浏览器中修改</button></div><div id="shortcutList"></div></section>
      <form id="operationGroupForm" class="prompt-template-form" hidden><input id="operationGroupId" type="hidden"><label>分组名称<input id="operationGroupName" maxlength="30" required placeholder="例如：写作工具"></label><div class="template-form-actions"><button id="cancelOperationGroup" type="button">取消</button><button class="primary" type="submit">保存分组</button></div></form>
      <form id="promptTemplateForm" class="prompt-template-form" hidden>
        <input id="promptTemplateId" type="hidden">
        <div class="form-grid"><label>操作名称<input id="promptTemplateName" maxlength="40" required placeholder="例如：技术文档翻译"></label><label>短标记<input id="operationIcon" maxlength="2" placeholder="译"></label></div>
        <div class="form-grid"><label>菜单位置<select id="operationGroup"><option value="">直接显示</option></select></label><label>分类<select id="promptTemplateCategory"><option value="general">通用</option><option value="translate">翻译</option><option value="reading">阅读</option><option value="writing">写作</option><option value="coding">编程</option><option value="custom">自定义</option></select></label></div>
        <div class="form-checks"><label><input id="operationEnabled" type="checkbox" checked>启用</label><label><input id="operationShowContext" type="checkbox" checked>显示在右键菜单</label><label><input id="operationShowPicker" type="checkbox" checked>显示在操作选择器</label></div>
        <label>提示词<textarea id="promptTemplatePrompt" rows="7" maxlength="12000" required placeholder="{{content}} 选中文字；{{pageTitle}} 网页标题；{{pageUrl}} 网页地址"></textarea></label>
        <div class="form-grid"><label>调用 AI<select id="operationTargetMode"><option value="selection">当前已选 AI</option><option value="active">侧栏当前 AI</option><option value="fixed">固定 AI</option><option value="ask">每次选择</option></select></label><label>执行方式<select id="operationExecution"><option value="direct">直接发送</option><option value="preview">侧栏预览</option></select></label></div>
        <div id="operationServices" class="operation-services"></div>
        <div class="form-grid"><label>回答模式<select id="operationAnswerMode"><option value="inherit">沿用全局</option><option value="expert">专家</option><option value="fast">快速</option></select></label><label>快捷槽位<select id="operationShortcutSlot"><option value="0">不绑定</option><option value="1">快捷操作 1</option><option value="2">快捷操作 2</option><option value="3">快捷操作 3</option><option value="4">快捷操作 4</option><option value="5">快捷操作 5</option><option value="6">快捷操作 6</option><option value="7">快捷操作 7</option><option value="8">快捷操作 8</option></select></label></div>
        <div class="template-form-actions"><button id="deleteOperation" type="button">删除</button><button id="restoreOperation" type="button">恢复内置默认</button><span></span><button id="cancelPromptTemplate" type="button">取消</button><button class="primary" type="submit">保存操作</button></div>
      </form>
    </section>
  </aside>

  <aside id="historyPanel" class="drawer" hidden><div class="drawer-head"><strong>本地历史</strong><button id="historyClose" class="icon-button">×</button></div><div id="historyList"></div></aside>
  <aside id="exportPanel" class="drawer" hidden><div class="drawer-head"><strong>内容摘取篮</strong><button id="exportClose" class="icon-button">×</button></div><p class="muted">可从多个面板依次摘取内容，再统一导出。</p><div id="exportList"></div><div class="export-actions"><button id="exportMarkdown">导出 Markdown</button><button id="exportPng">导出 PNG</button><button id="exportPdf">打印 / PDF</button><button id="exportClear">清空</button></div></aside>
  <aside id="notesPanel" class="drawer" hidden><div class="drawer-head"><strong>划线与笔记</strong><button id="notesClose" class="icon-button">×</button></div><div id="notesList"></div></aside>

  <template id="frameTemplate">
    <article class="frame-card" draggable="true">
      <header class="frame-head">
        <div class="frame-tab-area"><span class="frame-service-tab"><img class="service-icon" alt=""><strong class="frame-name sr-only"></strong></span><small class="frame-status"></small></div>
        <div class="frame-actions">
          <button data-action="locate" title="定位上一个问题" aria-label="定位上一个问题"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s6-5.1 6-11a6 6 0 1 0-12 0c0 5.9 6 11 6 11Z"/><circle cx="12" cy="10" r="2.3"/></svg></button>
          <button data-action="pick" title="选择内容导出" aria-label="选择内容导出"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2.5"/><path d="M12 7v8M8.5 11.5 12 15l3.5-3.5M8 18h8"/></svg></button>
          <button data-action="highlight" title="划线" aria-label="划线"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14.7 4.3 5 5-9.8 9.8H5v-4.9Z"/><path d="m12.5 6.5 5 5M4 21h16"/></svg></button>
          <button data-action="new" title="创建新对话" aria-label="创建新对话"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 14a4 4 0 0 1-4 4H9l-5 3v-5.5A7 7 0 0 1 3 12V8a4 4 0 0 1 4-4h6"/><path d="M18 3v6M15 6h6"/></svg></button>
          <button data-action="copy-link" title="复制当前链接" aria-label="复制当前链接"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10.5 13.5 3-3"/><path d="m8.3 15.7-1.4 1.4a4 4 0 0 1-5.7-5.7l3.2-3.2a4 4 0 0 1 5.7 0"/><path d="m15.7 8.3 1.4-1.4a4 4 0 0 1 5.7 5.7l-3.2 3.2a4 4 0 0 1-5.7 0"/></svg></button>
          <button data-action="reload" title="刷新" aria-label="刷新"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6v5h-5"/><path d="M18.4 17.5A8 8 0 1 1 20 11"/></svg></button>
          <button data-action="open" title="新标签页打开" aria-label="新标签页打开"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9"/><path d="M18 13v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h5"/></svg></button>
          <button data-action="close" title="关闭平台" aria-label="关闭平台"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m9 9 6 6M15 9l-6 6"/></svg></button>
        </div>
      </header>
      <iframe loading="eager"></iframe><div class="col-resizer" title="拖动调整相邻列宽" aria-label="拖动调整相邻列宽"></div>
    </article>
  </template>

  <script src="../shared/services.js"></script><script src="../shared/platform-adapters.js"></script><script src="../shared/prompt-templates.js"></script><script src="../shared/export-core.js"></script><script src="../shared/privacy-ui.js"></script><script src="../shared/affiliate-public-key.js"></script><script src="../shared/affiliate-catalog.js"></script><script src="app.js"></script>
</body>
</html>
